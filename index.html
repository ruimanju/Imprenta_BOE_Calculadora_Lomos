<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de grosor de lomo y consumo</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 14px;
            font-size: 1em;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            font-size: 1.35em;
        }

        .calculator {
            width: 360px;
            margin: 0 auto;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 4px;
            background-color: #fafafa;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.9em;
            font-weight: 600;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 7px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 3px;
        }

        .row-inputs {
            display: flex;
            gap: 10px;
        }

        .row-inputs div {
            flex: 1;
        }
        
        .custom-grosor-container {
            display: none;
            margin-top: -5px;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        button.action-btn {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }

        button.action-btn:hover {
            background-color: #0056b3;
        }

        .results-box {
            margin-top: 12px;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.92em;
        }

        .results-box p {
            margin: 4px 0;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .logo {
            max-width: 440px;
            height: auto;
        }

        .advertencia {
            color: #d9534f;
            font-weight: bold;
        }

        #toggle-table-btn {
            width: 220px;
            margin: 15px auto 0;
            padding: 9px;
            background-color: #dae2e4;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
        }

        #papeles-table-container {
            width: 540px;
            margin: 15px auto;
            padding: 8px;
            border: 1px solid #e0e6ed;
            border-radius: 4px;
            background-color: #f2f2f2;
            display: none;
        }

        #papeles-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
        }

        #papeles-table th,
        #papeles-table td {
            border: 1px solid #ccc;
            padding: 6px 8px;
            text-align: left;
        }

        #papeles-table th {
            background-color: #dae2e4;
        }

        #papeles-table tbody tr {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #papeles-table tbody tr:hover {
            background-color: #e6f2ff !important;
        }

        .papel-cursiva {
            font-style: italic;
        }

        .papel-rojo {
            color: red;
        }

        .leyenda {
            font-size: 0.85em;
            margin-top: 10px;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <a href="https://ruimanju.github.io/OOOTT_Acceso_Apps/">
            <img src="img/logo.png" alt="BOE - OO TT" class="logo">
        </a>
    </div>

    <h1>Calculadora de grosor de lomo y pliegos</h1>

    <div class="calculator" id="calculadora-box">
        <label for="papel">Tipo de papel:</label>
        <select name="papel" id="papel"></select>

        <div class="custom-grosor-container" id="custom-grosor-container">
            <label for="grosor_personalizado">Grosor de hoja (mm):</label>
            <input type="number" id="grosor_personalizado" name="grosor_personalizado" min="0" step="0.001" placeholder="Ej: 0.125">
        </div>

        <div class="row-inputs">
            <div>
                <label for="num_paginas">Páginas:</label>
                <input type="number" id="num_paginas" name="num_paginas" placeholder="Ej: 240" required>
            </div>
            <div>
                <label for="tirada">Tirada (ejemp.):</label>
                <input type="number" id="tirada" name="tirada" placeholder="Ej: 500">
            </div>
        </div>

        <div class="row-inputs">
            <div>
                <label for="formato_libro">Formato libro:</label>
                <select id="formato_libro">
                    <option value="170x240">17 x 24 cm</option>
                    <option value="150x210">15 x 21 cm (A5 aprox)</option>
                    <option value="210x297">21 x 29.7 cm (A4)</option>
                </select>
            </div>
            <div>
                <label for="merma">Merma (%):</label>
                <input type="number" id="merma" value="5" min="0" max="30">
            </div>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="tapa_dura" name="tapa_dura">
            <label for="tapa_dura" style="margin-bottom:0; font-weight:normal;">Libro en tapa dura (+6 mm)</label>
        </div>

        <button class="action-btn" onclick="calcular()">Calcular</button>

        <div class="results-box" id="results-box" style="display:none;">
            <p id="result-lomo"></p>
            <p id="result-consumo"></p>
            <div id="advertencia"></div>
        </div>
    </div>

    <button id="toggle-table-btn">Mostrar catálogo</button>

    <div id="papeles-table-container">
        <h3>Catálogo de papeles y grosores</h3>
        <p style="font-size: 0.8em; color: #555; margin-top:-5px;">Haz clic en cualquier fila para cargarla en la calculadora.</p>
        <table id="papeles-table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Grosor (mm)</th>
                    <th>págs<br>max/vol</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <p class="leyenda">En negro los papeles estándar, <span class="papel-cursiva">en cursiva</span> los que provisionalmente están sin stock y <span class="papel-rojo">en rojo</span> los de sustitución.</p>
    </div>

<script>
    const PAPELES_CURSIVA = [
        "Offset Superior Blanco 200 gr FSC/M"
    ];
    const PAPELES_ROJO_NEGRITA = [
        "Offset Superior Blanco 190 gr FSC/M",
        "Offset Superior Blanco 225 gr FSC/M"
    ];

    const PAPEL_GROSORES = {
        "Semibiblia Blanco 50 gr FSC/M": 0.0552,
        "Semibiblia Blanco 60 gr FSC/M": 0.064,
        "Offset Superior Blanco 60 gr FSC/M": 0.0740,
        "Offset Superior Blanco 70 gr FSC/M": 0.087,
        "Offset Superior Blanco 80 gr FSC/M": 0.1000,
        "Offset Superior Blanco 90 gr FSC/M": 0.1113,
        "Offset Superior Blanco 150 gr FSC/M": 0.1719,
        "Offset Superior Blanco 200 gr FSC/M": 0.2530,
        "Offset Superior Blanco 190 gr FSC/M": 0.2280,
        "Offset Superior Blanco 225 gr FSC/M": 0.2870,
        "Offset Ahuesado 80 gr FSC/M": 0.0952,
        "Offset Ahuesado 90 gr FSC/M": 0.1042,
        "Registro Ahuesado 140 gr FSC/M": 0.1510,
        "Estucado Semimate Blanco 90 gr FSC/M": 0.0773,
        "Estucado Semimate Blanco 135 gr FSC/M": 0.1160,
        "Estucado Semimate Blanco 170 gr FSC/M": 0.1460,
        "Estucado Semimate Blanco 300 gr FSC/M": 0.2780
    };

    const PAPEL_URLS = {
        "Semibiblia Blanco 50 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=2141",
        "Semibiblia Blanco 60 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=3095",
        "Offset Superior Blanco 60 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=2548",
        "Offset Superior Blanco 70 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=2250",
        "Offset Superior Blanco 80 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=1864",
        "Offset Superior Blanco 90 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=1816",
        "Offset Superior Blanco 150 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=1990",
        "Offset Superior Blanco 200 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=1775",
        "Offset Superior Blanco 190 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=2184",
        "Offset Superior Blanco 225 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=2924",
        "Offset Ahuesado 80 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=2034",
        "Offset Ahuesado 90 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=2035",
        "Registro Ahuesado 140 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=1012",
        "Estucado Semimate Blanco 90 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=3026",
        "Estucado Semimate Blanco 135 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=3036",
        "Estucado Semimate Blanco 170 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=1843",
        "Estucado Semimate Blanco 300 gr FSC/M": "https://intraboe.boe.es/almacen/ficha_material.php?id_tipo_material=1797"
    };

    const selectPapel = document.getElementById('papel');
    const numPaginasInput = document.getElementById('num_paginas');
    const tiradaInput = document.getElementById('tirada');
    const formatoLibroSelect = document.getElementById('formato_libro');
    const mermaInput = document.getElementById('merma');
    const customGrosorContainer = document.getElementById('custom-grosor-container');
    const customGrosorInput = document.getElementById('grosor_personalizado');
    const tapaDuraCheckbox = document.getElementById('tapa_dura');
    const toggleTableBtn = document.getElementById('toggle-table-btn');
    const papelesTableContainer = document.getElementById('papeles-table-container');
    const papelesTableBody = document.querySelector('#papeles-table tbody');

    // Función auxiliar para formatear números con punto de millar
    function formatoMillares(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function llenarSelect() {
        selectPapel.innerHTML = '';
        for (const papel in PAPEL_GROSORES) {
            const option = document.createElement('option');
            option.value = papel;
            option.text = papel;

            if (PAPELES_CURSIVA.includes(papel)) option.classList.add('papel-cursiva');
            if (PAPELES_ROJO_NEGRITA.includes(papel)) option.classList.add('papel-rojo');
            selectPapel.add(option);
        }
        const otroOption = document.createElement('option');
        otroOption.value = 'otro';
        otroOption.text = 'Otro...';
        selectPapel.add(otroOption);
    }

    function redondearAlza(numero) {
        return Math.ceil(numero * 2) / 2;
    }

    // Calcula cuántas páginas de libro caben por pliego matriz (asumiendo 70x100 cortado a 330x487)
    function paginasPorPliego(formato) {
        switch (formato) {
            case '170x240': return 16; // 4 hojas máq x 4 págs
            case '150x210': return 16; // 4 hojas máq x 4 págs
            case '210x297': return 8;  // 4 hojas máq x 2 págs
            default: return 16;
        }
    }

    function calcular() {
        const papelSeleccionado = selectPapel.value;
        const numPaginas = parseInt(numPaginasInput.value, 10);
        const tirada = parseInt(tiradaInput.value, 10) || 0;
        const mermaPct = parseFloat(mermaInput.value) || 0;
        let grosorHoja = (papelSeleccionado === 'otro') ? parseFloat(customGrosorInput.value) : PAPEL_GROSORES[papelSeleccionado];

        if (!grosorHoja || !numPaginas || numPaginas <= 0) {
            alert("Introduce al menos un número válido de páginas y grosor.");
            return;
        }

        // --- CÁLCULO DE LOMO ---
        let lomo = (numPaginas / 2) * grosorHoja;
        let limite = 50;
        if (tapaDuraCheckbox.checked) {
            lomo += 6;
            limite = 56;
        }
        lomo = redondearAlza(lomo);

        document.getElementById('results-box').style.display = 'block';
        document.getElementById('result-lomo').innerHTML = `<strong>Lomo estimado:</strong> ${lomo} mm`;

        const advEl = document.getElementById('advertencia');
        if (lomo > limite) {
            advEl.innerHTML = "<p class='advertencia'>Advertencia: Este volumen supera el grosor recomendado.</p>";
        } else {
            advEl.innerHTML = "";
        }

        // --- CÁLCULO DE CONSUMO DE PAPEL ---
        const resultConsumoEl = document.getElementById('result-consumo');
        if (tirada > 0) {
            const pagsPliego = paginasPorPliego(formatoLibroSelect.value);
            const pliegosNetos = Math.ceil((numPaginas * tirada) / pagsPliego);
            const pliegosBrutos = Math.ceil(pliegosNetos * (1 + (mermaPct / 100)));

            resultConsumoEl.innerHTML = `<strong>Papel necesario:</strong> ${formatoMillares(pliegosBrutos)} pliegos matriz (inc. ${mermaPct}% merma)`;
        } else {
            resultConsumoEl.innerHTML = "";
        }
    }

    function generarTablaPapeles() {
        papelesTableBody.innerHTML = '';
        for (const papel in PAPEL_GROSORES) {
            const row = document.createElement('tr');
            const nombreCell = document.createElement('td');
            const grosorCell = document.createElement('td');
            const maxPagCell = document.createElement('td');
            const stockCell = document.createElement('td');

            // Clic en la fila: selecciona en el combo y sube el scroll
            row.addEventListener('click', (e) => {
                if (e.target.tagName.toLowerCase() !== 'a') {
                    selectPapel.value = papel;
                    selectPapel.dispatchEvent(new Event('change'));
                    document.getElementById('calculadora-box').scrollIntoView({ behavior: 'smooth' });
                }
            });

            const url = PAPEL_URLS[papel];
            if (url) {
                const link = document.createElement('a');
                link.href = url;
                link.textContent = papel;
                link.target = "_blank";
                link.onclick = (e) => e.stopPropagation();
                if (PAPELES_ROJO_NEGRITA.includes(papel)) link.style.color = 'red';
                nombreCell.appendChild(link);
            } else {
                nombreCell.textContent = papel;
            }

            const grosor = PAPEL_GROSORES[papel];
            grosorCell.textContent = grosor;

            const gramajeMatch = papel.match(/(\d+)\s*gr/i);
            const gramaje = gramajeMatch ? parseInt(gramajeMatch[1], 10) : null;

            if (gramaje && gramaje <= 150 && grosor > 0) {
                const maxHojas = Math.floor(52 / grosor);
                maxPagCell.textContent = formatoMillares(maxHojas * 2);
            } else {
                maxPagCell.textContent = '';
            }
            maxPagCell.style.textAlign = 'right';

            stockCell.textContent = '-';
            stockCell.style.textAlign = 'right';

            if (PAPELES_CURSIVA.includes(papel)) nombreCell.classList.add('papel-cursiva');
            if (PAPELES_ROJO_NEGRITA.includes(papel)) nombreCell.classList.add('papel-rojo');

            row.appendChild(nombreCell);
            row.appendChild(grosorCell);
            row.appendChild(maxPagCell);
            row.appendChild(stockCell);
            papelesTableBody.appendChild(row);
        }
    }

    selectPapel.addEventListener('change', function() {
        if (selectPapel.value === 'otro') {
            customGrosorContainer.style.display = 'block';
        } else {
            customGrosorContainer.style.display = 'none';
        }
    });

    toggleTableBtn.addEventListener('click', function() {
        if (papelesTableContainer.style.display === 'none' || papelesTableContainer.style.display === '') {
            generarTablaPapeles();
            papelesTableContainer.style.display = 'block';
            toggleTableBtn.textContent = 'Ocultar catálogo';
        } else {
            papelesTableContainer.style.display = 'none';
            toggleTableBtn.textContent = 'Mostrar catálogo';
        }
    });

    [numPaginasInput, tiradaInput, mermaInput].forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') calcular();
        });
    });

    llenarSelect();
</script>
</body>
</html>
